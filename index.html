<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shree Shiddhi Vinayak Medical — Credit Book</title>
<style>
:root{--bg:#f2f6f5;--card:#fff;--card2:#f7fbfa;--text:#0d1f1c;--muted:#5d7571;--line:#e0eae7;--brand:#0d7a6f;--brand2:#0a5d55;--brand-soft:#e6f4f1;--green:#15803d;--yellow:#c2860b;--red:#dc2626;--deep:#8b1a1a;--shadow:0 1px 2px rgba(13,40,36,.05),0 10px 26px rgba(13,40,36,.07);--radius:16px;--nav-h:64px}
[data-theme="dark"]{--bg:#0a1413;--card:#12201e;--card2:#162725;--text:#e9f4f2;--muted:#8fa8a4;--line:#1f3230;--brand:#2dd4bf;--brand2:#14b8a6;--brand-soft:#12302c;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--deep:#ef4444;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
a{color:var(--brand)}
#topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.12)}
[data-theme="dark"] #topbar{background:#0f2b27}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.shop{font-weight:700;font-size:14.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-sub{font-size:11.5px;opacity:.82;letter-spacing:.3px;text-transform:uppercase}
.hdr-actions{display:flex;gap:6px;flex:none}
.hdr-actions button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;width:38px;height:36px;font-size:15px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.hdr-actions button:active{background:rgba(255,255,255,.3)}
main{padding:12px 12px 24px;max-width:860px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.tight{padding:0;overflow:hidden}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 4px 8px}
.sec-title h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.sec-title .link{font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;background:none;border:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .val{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.stat.wide{grid-column:1/-1}
.stat.red .val{color:var(--red)}.stat.green .val{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{padding:7px 10px;min-height:36px;font-size:13px;border-radius:10px}
.btn-block{display:flex;width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
.b-good{background:#dcfce7;color:#15803d}.b-avg{background:#fef3c7;color:#a16207}.b-risk{background:#fee2e2;color:#b91c1c}
[data-theme="dark"] .b-good{background:#0d3a22;color:#6ee7a8}
[data-theme="dark"] .b-avg{background:#3d2f08;color:#fcd34d}
[data-theme="dark"] .b-risk{background:#3f1414;color:#fca5a5}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-paid{background:#dcfce7;color:#15803d}.p-part{background:#dbeafe;color:#1d4ed8}.p-pend{background:#f1f5f9;color:#475569}.p-over{background:#fee2e2;color:#b91c1c}
[data-theme="dark"] .p-paid{background:#0d3a22;color:#6ee7a8}
[data-theme="dark"] .p-part{background:#122b4d;color:#93c5fd}
[data-theme="dark"] .p-pend{background:#1e2b2a;color:#94a3b8}
[data-theme="dark"] .p-over{background:#3f1414;color:#fca5a5}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:16px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{text-align:right;flex:none}
.amt{font-weight:800;font-size:15px;letter-spacing:-.2px}
.amt.red{color:var(--red)}.amt.green{color:var(--green)}
.urg{border-left:4px solid var(--green)}
.urg.yellow{border-left-color:var(--yellow)}.urg.red{border-left-color:var(--red)}.urg.deep{border-left-color:var(--deep)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.6}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);outline:none;font-size:15px;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:var(--card)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.switch .sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input{display:none}
.switch input:checked + .sw{background:var(--brand)}
.switch input:checked + .sw::after{left:23px}
.modal-backdrop{position:fixed;inset:0;background:rgba(6,20,18,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slide .2s ease}
@media(min-width:640px){.modal-backdrop{align-items:center}.modal{border-radius:20px;max-height:88vh}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:16.5px;font-weight:800}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.modal-foot .btn{flex:1}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;align-items:stretch;box-shadow:0 -2px 14px rgba(13,40,36,.07)}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;padding:6px 0}
#nav button .ic{font-size:19px;line-height:1}
#nav button.active{color:var(--brand)}
#nav .spacer{flex:.75}
#fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:28px;font-weight:300;box-shadow:0 6px 20px rgba(13,122,111,.45);cursor:pointer;z-index:45;display:grid;place-items:center;line-height:1}
#fab:active{transform:scale(.94)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 84px);transform:translate(-50%,20px);background:#111e1c;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tl-item{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.tl-item:last-child{border-bottom:0}
.tl-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;font-weight:800}
.tl-credit{background:#fee2e2;color:#b91c1c}
.tl-pay{background:#dcfce7;color:#15803d}
[data-theme="dark"] .tl-credit{background:#3f1414;color:#fca5a5}
[data-theme="dark"] .tl-pay{background:#0d3a22;color:#6ee7a8}
.progress{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:999px}
.progress.warn > i{background:var(--yellow)}.progress.bad > i{background:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
canvas{max-width:100%}
.lock-wrap{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock-logo{width:74px;height:74px;border-radius:22px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;box-shadow:var(--shadow)}
.pin-dots{display:flex;gap:14px;margin:6px 0 4px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);background:transparent;transition:.15s}
.pin-dot.on{background:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px;margin-top:6px}
.keypad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.keypad button:active{background:var(--brand-soft)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.login-note{font-size:12.5px;color:var(--muted);text-align:center;max-width:290px}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
table.rep td.num,table.rep th.num{text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#splash{position:fixed;inset:0;z-index:400;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;color:#fff;user-select:none;-webkit-user-select:none;cursor:pointer;background:radial-gradient(120% 90% at 50% 0%,#14a99a 0%,#0d7a6f 45%,#05403b 100%);transition:opacity .5s ease,transform .5s ease,visibility .5s;animation:splashKill .5s ease 2.4s forwards}
@keyframes splashKill{to{opacity:0;visibility:hidden;pointer-events:none}}
#splash::before{content:"";position:absolute;top:-180px;left:50%;width:560px;height:560px;margin-left:-280px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 62%);animation:glowPulse 3.2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.2);opacity:1}}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.05);pointer-events:none}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.splash-badge{position:relative;display:grid;place-items:center;width:120px;height:120px;margin-bottom:26px}
.splash-badge .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:ripple 2.4s ease-out infinite}
.splash-badge .ring.r2{animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(.68);opacity:.9}100%{transform:scale(1.65);opacity:0}}
.splash-logo{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-size:50px;font-weight:800;line-height:1;color:#0d7a6f;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.32),inset 0 -4px 10px rgba(13,122,111,.12);animation:popIn .75s cubic-bezier(.2,1.35,.4,1) both}
@keyframes popIn{0%{transform:scale(.35) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.splash-name{font-size:21px;font-weight:800;letter-spacing:.2px;line-height:1.25;animation:riseIn .6s ease .32s both}
.splash-sub{margin-top:7px;font-size:11px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;opacity:.78;animation:riseIn .6s ease .46s both}
.splash-bar{width:156px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:30px;animation:riseIn .6s ease .6s both}
.splash-bar i{display:block;height:100%;width:42%;border-radius:99px;background:#fff;animation:loadSlide 1.5s ease-in-out infinite}
@keyframes loadSlide{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
.splash-tip{margin-top:16px;font-size:11.5px;letter-spacing:.6px;opacity:.6;animation:riseIn .6s ease .8s both}
@keyframes riseIn{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){#splash *,#splash::before{animation:none!important}#splash.out{transition:opacity .25s}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-badge"><span class="ring"></span><span class="ring r2"></span><div class="splash-logo">✚</div></div>
    <div class="splash-name">Shree Shiddhi Vinayak<br>Medical</div>
    <div class="splash-sub">Credit Book</div>
    <div class="splash-bar"><i></i></div>
    <div class="splash-tip">Tap to continue</div>
  </div>
</div>
<div id="lock" class="lock-wrap hidden">
  <div class="lock-logo">✚</div>
  <div style="text-align:center">
    <div style="font-weight:800;font-size:16px">Shree Shiddhi Vinayak Medical</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:2px" id="lockSub">Credit Book</div>
  </div>
  <div class="pin-dots" id="pinDots"></div>
  <div class="keypad" id="keypad"></div>
  <div class="login-note" id="lockNote"></div>
</div>
<div id="app" class="hidden">
  <header id="topbar">
    <div class="brand"><div class="logo">✚</div><div style="min-width:0">
      <div class="shop" id="shopName">Shree Shiddhi Vinayak Medical</div>
      <div class="shop-sub" id="shopSub">Credit Book</div>
    </div></div>
    <div class="hdr-actions">
      <button id="btnLang" title="Language">EN</button>
      <button id="btnTheme" title="Theme">🌙</button>
      <button id="btnLock" title="Lock">🔒</button>
    </div>
  </header>
  <main id="main"></main>
  <button id="fab" title="Add Credit">+</button>
  <nav id="nav"></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inrFmt(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);let s=n.toFixed(2);let[ip,fp]=s.split('.');fp=(fp==='00')?'':'.'+fp;let last3=ip.slice(-3);let rest=ip.slice(0,-3);if(rest)last3=','+last3;rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');return(neg?'-':'')+rest+last3+fp}
const rs=n=>'Rs '+inrFmt(n);
const IST='Asia/Kolkata';
function istToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:IST,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function istNow(){return new Intl.DateTimeFormat('en-GB',{timeZone:IST,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function d2u(d){const[y,m,dd]=d.split('-').map(Number);return Date.UTC(y,m-1,dd)}
function u2d(u){return new Date(u).toISOString().slice(0,10)}
function addDays(d,n){return u2d(d2u(d)+n*86400000)}
function addMonths(d,n){
  const [y,m,dd]=d.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1+n,1));
  const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();
  dt.setUTCDate(Math.min(dd,last));
  return dt.toISOString().slice(0,10);
}
function daysBetween(a,b){return Math.round((d2u(b)-d2u(a))/86400000)}
function fmtDate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function fmtDT(d,t){return fmtDate(d)+(t?` ${t}`:'')}
const DB_KEY='ssvm_creditbook_v1';
let DB=null;
const UI={view:'home',search:'',filter:'all',detailId:null,sort:'amount',reportTab:'month'};
const SESSION={unlocked:false,lastActivity:Date.now()};
function newDB(){return{borrowers:[],credits:[],payments:[],log:[],settings:{shopName:'Shree Shiddhi Vinayak Medical',pin:'1234',lang:'en',theme:'light',role:'owner',autoLockMin:5,seeded:false},meta:{lastNotified:''}}}
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.borrowers)return d}}catch(e){console.warn('load failed',e)}return null}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){toast('Storage full — please export a backup')}}
function logAction(action,details){DB.log.unshift({id:uid('log'),ts:new Date().toISOString(),role:DB.settings.role,action,details});if(DB.log.length>400)DB.log.length=400}
const I18N={

function t(k){const lang=(DB&&DB.settings.lang)||'en';return(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k}
const L=()=>(DB&&DB.settings.lang)||'en';
function creditPaid(cid){return DB.payments.filter(p=>p.creditId===cid).reduce((s,p)=>s+p.amount,0)}
function borrowerBalance(bid){const c=DB.credits.filter(x=>x.borrowerId===bid).reduce((s,x)=>s+x.amount,0);const p=DB.payments.filter(x=>x.borrowerId===bid).reduce((s,x)=>s+x.amount,0);return Math.round((c-p)*100)/100}
function borrowerTotals(bid){const given=DB.credits.filter(x=>x.borrowerId===bid).reduce((s,x)=>s+x.amount,0);const paid=DB.payments.filter(x=>x.borrowerId===bid).reduce((s,x)=>s+x.amount,0);return{given,paid,balance:Math.round((given-paid)*100)/100}}
function nextDue(c,paid){if(c.installments&&c.installments.length){let cum=0;for(const ins of c.installments){cum+=ins.amount;if(paid<cum-0.001)return{date:ins.dueDate,no:ins.no}}return{date:c.installments[c.installments.length-1].dueDate,no:c.installments.length}}return{date:c.dueDate,no:null}}
function creditInfo(c){let finesAccrued=0;const today=istToday();if(c.emiData&&c.emiData.fine>0&&c.installments){let cum=0;for(const ins of c.installments){cum+=ins.amount;const paid=creditPaid(c.id);if(paid>=cum-0.001)continue;if(daysBetween(ins.dueDate,today)>0){finesAccrued+=c.emiData.fine;break}}}const paid=creditPaid(c.id);const totalPayable=c.amount+finesAccrued;const remaining=Math.max(0,Math.round((totalPayable-paid)*100)/100);const nd=nextDue(c,paid);const days=daysBetween(today,nd.date);let status='pending';if(remaining<=0.001)status='paid';else if(days<0)status='overdue';else if(paid>0.001)status='partial';return{paid,remaining,dueDate:nd.date,installmentNo:nd.no,days,status,finesAccrued,totalPayable}}
function statusLabel(st){return st==='paid'?t('paidStatus'):st==='overdue'?t('overdueStatus'):st==='partial'?t('partiallyPaid'):t('pending')}
function statusClass(st){return st==='paid'?'p-paid':st==='overdue'?'p-over':st==='partial'?'p-part':'p-pend'}
function urgencyClass(days){if(days>=0)return'green';if(days>=-7)return'yellow';if(days>=-30)return'red';return'deep'}
function urgencyColor(days){const c=urgencyClass(days);return c==='green'?'var(--green)':c==='yellow'?'var(--yellow)':c==='red'?'var(--red)':'var(--deep)'}
function startOfWeekISO(){const today=istToday();const dow=new Date(d2u(today)).getUTCDay();const diff=(dow+6)%7;return addDays(today,-diff)}
function isStaff(){return DB.settings.role==='staff'}
let toastTimer=null;
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal({title,body,footer='',onMount=null}){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div>`;$('#modalRoot').appendChild(wrap);wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.closest('[data-close]'))wrap.remove()});if(onMount)onMount(wrap);return wrap}
function confirmAction(title,message,onYes,danger=true){const m=openModal({title,body:`<p style="margin:4px 0 0;color:var(--muted);font-size:14px">${esc(message)}</p>`,footer:`<button class="btn" data-close>${t('cancel')}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfmYes">${t('yes')}</button>`});m.querySelector('#cfmYes').onclick=()=>{m.remove();onYes()}}
function renderHeader(){$('#shopName').textContent=DB.settings.shopName;$('#shopSub').textContent=t('creditBook')+(isStaff()?' · '+t('staff'):'');$('#btnLang').textContent=L()==='hi'?'हि':'EN';$('#btnTheme').textContent=DB.settings.theme==='dark'?'☀️':'🌙'}
function renderNav(){const items=[{v:'home',ic:'🏠',l:t('home')},{v:'borrowers',ic:'👥',l:t('borrowers')},{v:'spacer',ic:'',l:''},{v:'reports',ic:'📊',l:t('reports')},{v:'more',ic:'⚙️',l:t('more')}];$('#nav').innerHTML=items.map(i=>i.v==='spacer'?'<div class="spacer"></div>':`<button data-act="nav" data-view="${i.v}" class="${UI.view===i.v?'active':''}"><span class="ic">${i.ic}</span>${esc(i.l)}</button>`).join('')}
function go(view){UI.view=view;if(view!=='detail')UI.detailId=null;render();window.scrollTo({top:0})}
function render(){document.documentElement.dataset.theme=DB.settings.theme;document.documentElement.lang=L();renderHeader();const main=$('#main');if(UI.view==='home')main.innerHTML=viewHome();else if(UI.view==='borrowers')main.innerHTML=viewBorrowers();else if(UI.view==='detail')main.innerHTML=viewDetail();else if(UI.view==='reports'){main.innerHTML=viewReports();requestAnimationFrame(drawCharts)}else if(UI.view==='more')main.innerHTML=viewMore();renderNav()}
function viewHome(){const today=istToday();const list=DB.credits.map(c=>({c,info:creditInfo(c)})).filter(x=>x.info.remaining>0.001);const totalOut=list.reduce((s,x)=>s+x.info.remaining,0);const overdue=list.filter(x=>x.info.days<0);const overdueAmt=overdue.reduce((s,x)=>s+x.info.remaining,0);const dueToday=list.filter(x=>x.info.days===0);const dueTomorrow=list.filter(x=>x.info.days===1);const weekStart=startOfWeekISO();const monthStart=today.slice(0,7)+'-01';const collectedWeek=DB.payments.filter(p=>p.date>=weekStart&&p.date<=today).reduce((s,p)=>s+p.amount,0);const collectedMonth=DB.payments.filter(p=>p.date>=monthStart&&p.date<=today).reduce((s,p)=>s+p.amount,0);const sorter=UI.sort==='oldest'?(a,b)=>a.info.days-b.info.days:(a,b)=>b.info.remaining-a.info.remaining;overdue.sort(sorter);dueToday.sort(sorter);dueTomorrow.sort(sorter);const balMap={};DB.borrowers.forEach(b=>balMap[b.id]=borrowerBalance(b.id));const top=Object.entries(balMap).filter(([,v])=>v>0.001).sort((a,b)=>b[1]-a[1]).slice(0,5);let html=`<div class="stats"><div class="stat"><div class="lbl">${t('totalOutstanding')}</div><div class="val">${rs(totalOut)}</div></div><div class="stat red"><div class="lbl">${t('overdueAmount')}</div><div class="val">${rs(overdueAmt)}</div></div><div class="stat green"><div class="lbl">${t('collectedWeek')}</div><div class="val">${rs(collectedWeek)}</div></div><div class="stat"><div class="lbl">${t('collectedMonth')}</div><div class="val">${rs(collectedMonth)}</div></div></div><div class="sec-title"><h2>${t('todaysCollection')}</h2><button class="link" data-act="toggle-sort">${UI.sort==='oldest'?t('sortAmount'):t('sortOldest')}</button></div>`;if(overdue.length){html+=`<div class="card tight" style="border-left:4px solid var(--red)"><div style="padding:10px 14px 4px;font-size:12px;font-weight:800;color:var(--red);letter-spacing:.5px;text-transform:uppercase">${t('overdue')} · ${overdue.length}</div>${overdue.map(collectRow).join('')}</div>`}if(dueToday.length){html+=`<div class="card tight"><div style="padding:10px 14px 4px;font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.5px;text-transform:uppercase">${t('dueToday')} · ${dueToday.length}</div>${dueToday.map(collectRow).join('')}</div>`}if(dueTomorrow.length){html+=`<div class="card tight"><div style="padding:10px 14px 4px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase">${t('dueTomorrow')} · ${dueTomorrow.length}</div>${dueTomorrow.map(collectRow).join('')}</div>`}if(!overdue.length&&!dueToday.length&&!dueTomorrow.length){html+=`<div class="card"><div class="empty"><div class="big">✅</div>${t('nothingDue')}</div></div>`}const regulars=DB.borrowers.filter(b=>b.monthlyCycle);if(regulars.length){html+=`<div class="sec-title"><h2>${t('quickPay')}</h2></div><div class="card">`;html+=regulars.map(b=>{const bal=borrowerBalance(b.id);return`<div class="kv"><span class="k">${esc(b.name)}</span><span class="v"><span style="color:${bal>0?'var(--red)':'var(--green)'};margin-right:8px">${rs(bal)}</span>${bal>0?`<button class="btn btn-sm btn-primary" data-act="add-payment" data-bid="${b.id}">₹ ${t('payNow')}</button>`:`<span class="pill p-paid">${t('clearedBadge')}</span>`}</span></div>`}).join('');html+=`</div>`}if(top.length){html+=`<div class="sec-title"><h2>${t('topBorrowers')}</h2></div><div class="card tight">`;html+=top.map(([bid,bal])=>{const b=DB.borrowers.find(x=>x.id===bid);if(!b)return'';return`<div class="row" data-act="open-borrower" data-id="${b.id}"><div class="avatar">${avatarInner(b)}</div><div class="row-main"><div class="row-title">${esc(b.name)}</div><div class="row-sub">${esc(b.phone||'')}</div></div><div class="row-right"><div class="amt red">${rs(bal)}</div></div></div>`}).join('');html+=`</div>`}return html}
function avatarInner(b){if(b.photo)return`<img src="${b.photo}" alt="">`;return esc((b.name||'?').trim().charAt(0).toUpperCase())}
function collectRow(x){const b=DB.borrowers.find(v=>v.id===x.c.borrowerId);if(!b)return'';const d=x.info.days;const late=d<0?`${-d} ${t('daysLate')}`:d===0?t('dueToday'):d===1?t('dueTomorrow'):`${t('dueIn')} ${d}d`;const instTag=x.info.installmentNo?` · ${t('installmentsMade')} ${x.info.installmentNo}/${x.c.installments.length}`:'';const fineTag=x.info.finesAccrued>0?` <span class="pill p-over" style="font-size:10px">+Fine ${rs(x.info.finesAccrued)}</span>`:'';return`<div class="row urg ${urgencyClass(d)}" data-act="open-credit" data-id="${x.c.id}"><div class="avatar">${avatarInner(b)}</div><div class="row-main"><div class="row-title">${esc(b.name)}${x.c.emiData?' <span class="badge b-avg">EMI</span>':''}</div><div class="row-sub" style="color:${urgencyColor(d)}">${esc(late)} · ${fmtDate(x.info.dueDate)}${instTag}${fineTag}</div></div><div class="row-right"><div class="amt">${rs(x.info.remaining)}</div><div style="display:flex;gap:6px;margin-top:5px;justify-content:flex-end"><button class="btn btn-sm" data-act="remind" data-id="${x.c.id}">💬</button><button class="btn btn-sm btn-primary" data-act="pay-credit" data-id="${x.c.id}">₹</button></div></div></div>`}

function creditTlItem(h){const c=h.obj;const info=creditInfo(c);const pays=DB.payments.filter(p=>p.creditId===c.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return`<div class="tl-item" style="flex-direction:column;align-items:stretch;gap:8px"><div style="display:flex;gap:10px;align-items:flex-start"><div class="tl-dot ${c.emiData?'tl-pay':'tl-credit'}">${c.emiData?'📱':'↑'}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><div style="font-weight:700;font-size:14px">${c.emiData?esc(c.emiData.productName):t('credits')} ${c.billNo?'· '+esc(c.billNo):''} ${c.emiData?`<span class="badge b-avg">EMI</span>`:''}</div><div class="amt">${rs(c.amount)}</div></div><div class="row-sub">${fmtDT(c.date,c.time)} · ${t('dueDate')} ${fmtDate(info.dueDate)}</div>${!c.emiData&&c.items?`<div class="row-sub">${esc(c.items)}</div>`:''}${c.emiData?`<div class="row-sub" style="margin-top:4px;color:var(--brand);font-weight:600">Price: ${rs(c.emiData.productPrice)} | Down: ${rs(c.emiData.downpayment)} | Fine: ${rs(c.emiData.fine)}</div>`:''}${c.installments?`<div class="row-sub">${t('installmentsMade')}: ${info.installmentNo}/${c.installments.length}</div>`:''}${info.finesAccrued>0?`<div class="row-sub" style="color:var(--red);font-weight:700;margin-top:4px">+ Late Fine Applied: ${rs(info.finesAccrued)}</div>`:''}<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px"><span class="pill p-paid">${t('paid')} ${rs(info.paid)}</span><span class="pill ${info.remaining>0?'p-over':'p-paid'}">${info.remaining>0?t('remaining')+' '+rs(info.remaining):t('clearedBadge')}</span></div></div></div>${pays.length?`<div style="margin-left:42px;border-left:2px solid var(--line);padding-left:10px"><div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;padding:4px 0">${t('recordOfPayments').toUpperCase()}</div>${pays.map(p=>`<div class="kv" style="padding:4px 0"><span class="k">${fmtDT(p.date,p. function paymentTlItem(h){const p=h.obj;return`<div class="tl-item"><div class="tl-dot tl-pay">↓</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><div style="font-weight:700;font-size:14px">${t('partPayment')} · ${t(p.mode)}</div><div class="amt green">${rs(p.amount)}</div></div><div class="row-sub">${fmtDT(p.date,p.time)}${p.note?' · '+esc(p.note):''}</div><button class="btn btn-sm" style="margin-top:6px" data-act="receipt" data-id="${p.id}">🧾 ${t('receipt')}</button></div></div>`}
function borrowerHistory(bid){const items=[];DB.credits.filter(c=>c.borrowerId===bid).forEach(c=>items.push({type:'credit',key:c.date+c.time,obj:c}));DB.payments.filter(p=>p.borrowerId===bid).forEach(p=>items.push({type:'payment',key:p.date+p.time,obj:p}));items.sort((a,b)=>b.key.localeCompare(a.key));return items}

function compressImage(file,maxSize,cb){const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)}

  });

  sched.addEventListener('change',updateSchedUI);updateSchedUI();
  m.querySelector('#cBorrower').addEventListener('change',e=>{if(e.target.value==='__new'){m.remove();openBorrowerForm(null,nb=>openCreditForm(nb.id))}});
  
  m.querySelector('#saveC').onclick=()=>{
    const isEmi=cType.value==='emi';
    const bid=m.querySelector('#cBorrower').value;
    if(!bid||bid==='__new'){toast(t('borrowers')+' ?');return}
    let amount=0;let emiData=null;let scheduleType=sched.value;let dueDate=m.querySelector('#cDue').value||addDays(istToday(),30);let installments=null;
    
    if(isEmi){
      const prodName=m.querySelector('#eProduct').value.trim();
      const price=Number(m.querySelector('#ePrice').value);
      const down=Number(m.querySelector('#eDown').value)||0;
      const n=Math.max(1,Number(m.querySelector('#eN').value)||4);
      const fine=Number(m.querySelector('#eFine').value)||0;
      const freqType=eFreq.value;
      const gapDays=freqType==='custom'?Math.max(1,Number(m.querySelector('#eCustomGap').value)||30):(freqType==='monthly'?30:freqType==='fortnightly'?15:7);
      
      if(!prodName){toast('Enter Product Name');return}
      if(!price||price<=0){toast('Enter product price');return}
      if(down>=price){toast('Downpayment cannot exceed total price');return}
      
      amount=price-down;
      emiData={productName:prodName,productPrice:price,downpayment:down,fine,freq:freqType,gapDays,n};
      
      let customAmounts = null;
      if(eSplit.value==='custom'){
        customAmounts = Array.from(m.querySelectorAll('.cInstAmt')).map(inp => Number(inp.value)||0);
        const sum = customAmounts.reduce((s, a) => s + a, 0);
        if(Math.abs(sum - amount) > 0.01){
          toast(t('sumMismatch') + ` Target: ${rs(amount)}, Got: ${rs(sum)}`);
          return;
        }
      }
      
      const firstDue=addDays(istToday(),gapDays);
      installments=buildInstallments(amount,n,firstDue,freqType,gapDays,customAmounts);
      dueDate=installments[0].dueDate;
      scheduleType='installments';
    }else{
      amount=Number(m.querySelector('#cAmount').value);
      if(!amount||amount<=0){toast(t('amount')+' ?');return}
      if(scheduleType==='installments'){
        const n=Math.max(2,Number(m.querySelector('#cN').value)||6);
        const first=m.querySelector('#cFirst').value||addDays(istToday(),30);
        const freq=m.querySelector('#cFreq').value;
        installments=buildInstallments(amount,n,first,freq,0,null);
        dueDate=installments[0].dueDate;
      }
    }
    
    const borrower=DB.borrowers.find(x=>x.id===bid);
    const limit=Number(borrower.creditLimit)||0;
    const newBal=borrowerBalance(bid)+amount;
    const proceed=()=>doSaveCredit(bid,amount,emiData,scheduleType,dueDate,installments);
    if(limit>0&&newBal>limit){
      confirmAction(t('creditLimit'),`${t('creditLimitWarn')} (${rs(limit)}) — ${t('continueQ')}`,proceed,false);
    }else{proceed()}
  };
  
  function doSaveCredit(bid,amount,emiData,scheduleType,dueDate,installments){

    const b=DB.borrowers.find(x=>x.id===bid);
    logAction('add_credit',`Credit ${rs(amount)} to ${b?b.name:bid}${emiData?' (EMI)':''}`);
    saveDB();m.remove();render();toast(t('saved'));
  }
}

function buildInstallments(amount,n,firstDue,freq,gapDays,customAmounts){
  const arr=[];let acc=0;
  const each=Math.round((amount/n)*100)/100;
  for(let i=0;i<n;i++){
    let amt;
    if(customAmounts && customAmounts[i] !== undefined){
      amt = customAmounts[i];
    } else {
      amt = (i===n-1) ? Math.round((amount-acc)*100)/100 : each;
    }
    acc += amt;
    let d;
    if(freq==='custom'){
      d=addDays(firstDue,i*gapDays);
    }else{
      d=freq==='monthly'?addMonths(firstDue,i):addDays(firstDue,i*(freq==='weekly'?7:15));
    }
    arr.push({no:i+1,amount:amt,dueDate:d});
  }
  return arr;
}

function exportCSV(){const lines=[];lines.push('BORROWERS');lines.push(['ID','Name','Phone','Address','Trust','Credit Limit','Monthly Cycle','Guarantor','Guarantor Phone','Notes','Balance','Cleared'].join(','));DB.borrowers.forEach(b=>lines.push([b.id,b.name,b.phone,b.address,b.trust,b.creditLimit,b.monthlyCycle?'Yes':'No',b.guarantorName,b.guarantorPhone,b.notes,borrowerBalance(b.id),borrowerBalance(b.id)<=0.001?'Yes':'No'].map(csvEscape).join(',')));lines.push('');lines.push('CREDITS');lines.push(['ID','Borrower','Amount','Date','Time','Bill No','Items','Repay Mode','Due Date','Schedule','Status','Paid','Remaining','Is EMI','Product Name','Product Price','Downpayment','Late Fine'].join(','));DB.credits.forEach(c=>{const b=DB.borrowers.find(x=>x.id===c.borrowerId);const i=creditInfo(c);lines.push([c.id,b?b.name:'',c.amount,fmtDate(c.date),c.time,c.billNo,c.items,c.repayMode,fmtDate(i.dueDate),c.schedule.type,i.status,i.paid,i.remaining,c.emiData?'Yes':'No',c.emiData?c.emiData.productName:'',c.emiData?c.emiData.productPrice:'',c.emiData?c.emiData.downpayment:'',c.emiData?c.emiData.fine:''].map(csvEscape).join(','))});lines.push('');lines.push('PAYMENTS');lines.push(['ID','Borrower','Credit ID','Amount','Date','Time','Mode','Note'].join(','));DB.payments.forEach(p=>{const b=DB.borrowers.find(x=>x.id===p.borrowerId);lines.push([p.id,b?b.name:'',p.creditId,p.amount,fmtDate(p.date),p.time,p.mode,p.note].map(csvEscape).join(','))});downloadFile(`creditbook-${istToday()}.csv`,'\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');logAction('export','CSV export');saveDB();toast(t('backupDone'))}

function viewReports(){const open=DB.credits.map(c=>creditInfo(c)).filter(i=>i.remaining>0.001);const totalOut=open.reduce((s,i)=>s+i.remaining,0);const overdueAmt=open.filter(i=>i.days<0).reduce((s,i)=>s+i.remaining,0);const byDay={},byMonth={};DB.credits.forEach(c=>{byDay[c.date]=byDay[c.date]||{cr:0,rc:0};byDay[c.date].cr+=c.amount;byMonth[c.date.slice(0,7)]=byMonth[c.date.slice(0,7)]||{cr:0,rc:0};byMonth[c.date.slice(0,7)].cr+=c.amount});DB.payments.forEach(p=>{byDay[p.date]=byDay[p.date]||{cr:0,rc:0};byDay[p.date].rc+=p.amount;byMonth[p.date.slice(0,7)]=byMonth[p.date.slice(0,7)]||{cr:0,rc:0};byMonth[p.date.slice(0,7)].rc+=p.amount});const tab=UI.reportTab;const source=tab==='day'?byDay:byMonth;const keys=Object.keys(source).sort().reverse().slice(0,tab==='day'?14:12);return`<div class="stats"><div class="stat"><div class="lbl">${t('totalOutstanding')}</div><div class="val">${rs(totalOut)}</div></div><div class="stat red"><div class="lbl">${t('overdueAmount')}</div><div class="val">${rs(overdueAmt)}</div></div></div><div class="sec-title"><h2>${t('creditVsRecovered')}</h2><span style="font-size:11px;color:var(--muted)">${t('allMonths')}</span></div><div class="card"><canvas id="chart" style="width:100%;height:190px"></canvas><div class="legend"><span><i style="background:var(--red)"></i>${t('creditGiven')}</span><span><i style="background:var(--green)"></i>${t('recovered')}</span></div></div><div class="chips" style="margin-top:8px"><button class="chip ${tab==='month'?'active':''}" data-act="rep-tab" data-tab="month">${t('reportMonth')}</button><button class="chip ${tab==='day'?'active':''}" data-act="rep-tab" data-tab="day">${t('reportDay')}</button></div><div class="card tight"><table class="rep"><thead><tr><th>${t('date')}</th><th class="num">${t('creditGiven')}</th><th class="num">${t('recovered')}</th></tr></thead><tbody>${keys.length?keys.map(k=>`<tr><td>${tab==='day'?fmtDate(k):k}</td><td class="num">${inrFmt(source[k].cr)}</td><td class="num" style="color:var(--green)">${inrFmt(source[k].rc)}</td></tr>`).join(''):`<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px">${t('noRecords')}</td></tr>`}</tbody></table></div><div class="btn-row" style="margin-top:14px"><button class="btn btn-block" data-act="export-csv">⬇ ${t('exportCsv')}</button><button class="btn btn-block" data-act="export-pdf">🖨 ${t('exportPdf')}</button></div>`}
function drawCharts(){const cv=$('#chart');if(!cv)return;const dpr=window.devicePixelRatio||1;const w=cv.clientWidth||320;const h=190;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement);const cRed=cs.getPropertyValue('--red').trim()||'#dc2626';const cGreen=cs.getPropertyValue('--green').trim()||'#15803d';const cMuted=cs.getPropertyValue('--muted').trim()||'#5d7571';const cLine=cs.getPropertyValue('--line').trim()||'#e0eae7';const today=istToday();const months=[];for(let i=5;i>=0;i--)months.push(addMonths(today.slice(0,8)+'01',-i).slice(0,7));const data=months.map(m=>({m,cr:DB.credits.filter(c=>c.date.slice(0,7)===m).reduce((s,c)=>s+c.amount,0),rc:DB.payments.filter(p=>p.date.slice(0,7)===m).reduce((s,p)=>s+p.amount,0)}));const max=Math.max(1,...data.map(d=>Math.max(d.cr,d.rc)));const padL=8,padR=8,padT=14,padB=26;const chartH=h-padT-padB;const groupW=(w-padL-padR)/data.length;const barW=Math.min(16,groupW/3.2);x.strokeStyle=cLine;x.lineWidth=1;for(let i=0;i<=3;i++){const y=padT+(chartH/3)*i;x.beginPath();x.moveTo(padL,y);x.lineTo(w-padR,y);x.stroke()}data.forEach((d,i)=>{const gx=padL+i*groupW+groupW/2;const hCr=(d.cr/max)*chartH;const hRc=(d.rc/max)*chartH;x.fillStyle=cRed;x.fillRect(gx-barW-2,padT+chartH-hCr,barW,hCr);x.fillStyle=cGreen;x.fillRect(gx+2,padT+chartH-hRc,barW,hRc);x.fillStyle=cMuted;x.font='10px system-ui, sans-serif';x.textAlign='center';x.fillText(d.m.slice(5)+'/'+d.m.slice(2,4),gx,h-8)})}

document.addEventListener('change',e=>{if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.borrowers)throw new Error('bad');DB=Object.assign(newDB(),d);saveDB();render();toast(t('restored'))}catch(err){toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}});
$('#btnTheme').onclick=()=>{DB.settings.theme=DB.settings.theme==='dark'?'light':'dark';saveDB();render()};
$('#btnLang').onclick=()=>{DB.settings.lang=DB.settings.lang==='hi'?'en':'hi';saveDB();render()};
$('#btnLock').onclick=()=>showLock();
$('#fab').onclick=()=>openCreditForm(null);

function seedSampleData(){const T=istToday();const mkB=o=>Object.assign({id:uid('b'),name:'',phone:'',address:'',photo:'',idRef:'',guarantorName:'',guarantorPhone:'',notes:'',trust:'average',creditLimit:0,monthlyCycle:false,interestEnabled:false,createdAt:new Date().toISOString(),sample:true},o);const b1=mkB({name:'Ramesh Kumar',phone:'9876543210',address:'Shop 12, Gandhi Nagar',trust:'good',creditLimit:5000,guarantorName:'Suresh Kumar',guarantorPhone:'9876500011',notes:'Regular customer — buys monthly medicines'});const b2=mkB({name:'Sunita Devi',phone:'9812345678',address:'Flat 3B, Shivaji Colony',trust:'average',creditLimit:3000});const b3=mkB({name:'Imran Shaikh',phone:'9700112233',address:'Near Bus Stand, Old City',trust:'risky',creditLimit:2000,notes:'Payments often delayed — follow up'});const b4=mkB({name:'Dr. Anil Joshi',phone:'9822004455',address:'Joshi Clinic, Main Road',trust:'good',creditLimit:8000,monthlyCycle:true,notes:'Monthly credit cycle — BP & diabetes medicines'});DB.borrowers.push(b1,b2,b3,b4);const mkC=o=>Object.assign({id:uid('c'),borrowerId:'',amount:0,date:T,time:'10:00',billNo:'',items:'',prescription:'',repayMode:'cash',schedule:{type:'fixed'},dueDate:T,notes:'',createdAt:new Date().toISOString(),sample:true},o);const c1=mkC({borrowerId:b1.id,amount:1200,date:addDays(T,-20),time:'11:20',billNo:'INV-1042',items:'Azithromycin 500 x6, Paracetamol x10',repayMode:'upi',dueDate:addDays(T,-6),schedule:{type:'monthly'}});const c2=mkC({borrowerId:b1.id,amount:600,date:addDays(T,-1),time:'18:05',billNo:'INV-1078',items:'Cough syrup, Vitamin C',repayMode:'cash',dueDate:addDays(T,1),schedule:{type:'fixed'}});const c3=mkC({borrowerId:b2.id,amount:850,date:addDays(T,-2),time:'09:40',billNo:'INV-1061',items:'Insulin pen, strips',repayMode:'cash',dueDate:T,schedule:{type:'fixed'}});const c4=mkC({borrowerId:b3.id,amount:2400,date:addDays(T,-45),time:'16:30',billNo:'INV-0987',items:'Full body checkup medicines',repayMode:'other',dueDate:addDays(T,-30),schedule:{type:'fixed'},notes:'Promised to pay after salary'});const c5=mkC({borrowerId:b4.id,amount:3200,date:addDays(T,-10),time:'12:15',billNo:'INV-1055',items:'Monthly BP & diabetes stock',repayMode:'upi',dueDate:addDays(T,5),schedule:{type:'installments'},prescription:'Telmisartan 40mg, Metformin 500mg — monthly'});c5.installments=buildInstallments(3200,4,addDays(T,-10),'monthly',0,null);DB.credits.push(c1,c2,c3,c4,c5);const mkP=o=>Object.assign({id:uid('p'),creditId:'',borrowerId:'',amount:0,date:T,time:'12:00',mode:'cash',note:'',createdAt:new Date().toISOString(),sample:true},o);DB.payments.push(mkP({creditId:c1.id,borrowerId:b1.id,amount:500,date:addDays(T,-10),time:'17:30',mode:'cash',note:'Part payment'}),mkP({creditId:c5.id,borrowerId:b4.id,amount:800,date:addDays(T,-5),time:'11:00',mode:'upi',note:'Installment 1'}));DB.log.push({id:uid('log'),ts:new Date().toISOString(),role:'owner',action:'seed',details:'Sample data loaded'});DB.settings.seeded=true}
function setupManifest(){try{const cv=document.createElement('canvas');cv.width=cv.height=192;const x=cv.getContext('2d');x.fillStyle='#0d7a6f';x.fillRect(0,0,192,192);x.fillStyle='#fff';x.font='bold 110px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('✚',96,100);const icon=cv.toDataURL('image/png');const manifest={name:'Shree Shiddhi Vinayak Medical — Credit Book',short_name:'Credit Book',start_url:'.',display:'standalone',background_color:'#0d7a6f',theme_color:'#0d7a6f',icons:[{src:icon,sizes:'192x192',type:'image/png',purpose:'any maskable'}]};const link=document.createElement('link');link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));document.head.appendChild(link);const apple=document.createElement('link');apple.rel='apple-touch-icon';apple.href=icon;document.head.appendChild(apple)}catch(e){}}
function init(){setupManifest();DB=loadDB();if(!DB){DB=newDB();seedSampleData();saveDB()}DB.settings=Object.assign(newDB().settings,DB.settings);DB.meta=Object.assign({lastNotified:''},DB.meta);updateNotifStatus();if(DB.settings.pin)showLock();else unlockApp();const splashEl=$('#splash');if(splashEl){const dismiss=()=>{if(!splashEl.parentNode)return;splashEl.classList.add('out');setTimeout(()=>{if(splashEl.parentNode)splashEl.remove()},520)};splashEl.addEventListener('click',dismiss);splashEl.addEventListener('touchstart',dismiss,{passive:true});setTimeout(dismiss,2600)}}
init();
</script>
